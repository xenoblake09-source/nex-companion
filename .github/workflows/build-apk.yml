# ---------------------------------------------------------------------------
# NEX — cloud APK build. Nothing is installed on anyone's computer:
# GitHub's own Linux runner checks out the repo, restores the executable bit
# on gradlew (browser uploads store files as 100644), installs JDK 17, builds
# the debug APK and runs every JVM unit test, then hands the APK back as a
# downloadable artifact.
#
# Cost: this repository is public, and GitHub Actions is unlimited for public
# repositories. If the repository ever becomes private, each run bills about
# 10-20 Linux minutes against the 2,000 min/month free allowance.
#
# The debug APK is signed with GitHub's ephemeral debug key - fine for your
# own phone. The release build is deliberately left unsigned: no keystore
# ever enters this repository.
# ---------------------------------------------------------------------------
name: Build APK

on:
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK + JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Restore the executable bit on gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK and run the JVM unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload the APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore
